---
- name: Deploy Django Application
  hosts: webserver
  become: yes
  
  vars:
    app_image: daihuu103/django-hello-world
    image_tag: latest
    app_port: 8000
  
  tasks:
    - name: Pull Docker image
      shell: docker pull {{ app_image }}:{{ image_tag }}
    
    - name: Stop and remove existing container if it exists
      shell: docker rm -f django-app || true
    
    - name: Run Docker container
      shell: docker run -d --name django-app -p {{ app_port }}:8000 {{ app_image }}:{{ image_tag }}
